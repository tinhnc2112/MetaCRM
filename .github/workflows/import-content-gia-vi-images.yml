name: Import content gia vi images

on:
  push:
    paths:
      - '.github/workflows/import-content-gia-vi-images.yml'

permissions:
  contents: write

jobs:
  import-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download generated images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/content-gia-vi-km
          curl -L --fail --retry 3 'https://oaisdmntprnznorth.blob.core.windows.net/files/00000000-5bf4-820b-84a0-030f7ecbd83d/raw?se=2026-09-29T13%3A27%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=bf388065-528c-49d6-9dc1-fa13d62cc607&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T03%3A53%3A14Z&ske=2026-09-30T03%3A53%3A14Z&sks=b&skv=2026-02-06&sig=dpwFiAfDzLXyf5p/nEIjluG1ezn3qlC6vJLlQEKvGZM%3D' -o assets/content-gia-vi-km/series2-01.png
          curl -L --fail --retry 3 'https://oaisdmntpraustraliaeast.blob.core.windows.net/files/00000000-9d34-81fa-be17-a2a6a3645734/raw?se=2026-09-29T13%3A27%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=bf388065-528c-49d6-9dc1-fa13d62cc607&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T11%3A53%3A43Z&ske=2026-09-30T11%3A53%3A43Z&sks=b&skv=2026-02-06&sig=%2Bnf%2BeCCr%2BcSnbGHrTpjK/201knmxhXhCn8RwRZxUlDo%3D' -o assets/content-gia-vi-km/series2-02.png
          curl -L --fail --retry 3 'https://oaisdmntpraustraliaeast.blob.core.windows.net/files/00000000-064c-81fa-a602-8b621c1be475/raw?se=2026-09-29T13%3A27%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=bf388065-528c-49d6-9dc1-fa13d62cc607&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T04%3A05%3A02Z&ske=2026-09-30T04%3A05%3A02Z&sks=b&skv=2026-02-06&sig=DyKjIn6kWTPX7gn3YtyPPuNgZJXDer7N/4bpG159UHw%3D' -o assets/content-gia-vi-km/series2-03.png
          curl -L --fail --retry 3 'https://oaisdmntprnznorth.blob.core.windows.net/files/00000000-c56c-820b-848a-90b12544b898/raw?se=2026-09-29T13%3A27%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=bf388065-528c-49d6-9dc1-fa13d62cc607&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T08%3A04%3A53Z&ske=2026-09-30T08%3A04%3A53Z&sks=b&skv=2026-02-06&sig=nbQcQpQDvircLxiX5Qxi43TjGD6pq8sJVGYilv1gZuU%3D' -o assets/content-gia-vi-km/series2-04.png
          curl -L --fail --retry 3 'https://oaisdmntprnznorth.blob.core.windows.net/files/00000000-cf0c-820b-aa29-f0bebcabb302/raw?se=2026-09-29T13%3A27%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=bf388065-528c-49d6-9dc1-fa13d62cc607&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T12%3A55%3A04Z&ske=2026-09-30T12%3A55%3A04Z&sks=b&skv=2026-02-06&sig=Fd4jysAIi9SxE3lL/tMIl8jwQNcV3xt%2BxlMSdrJSxdo%3D' -o assets/content-gia-vi-km/series2-05.png
          curl -L --fail --retry 3 'https://oaisdmntprnznorth.blob.core.windows.net/files/00000000-ee6c-820b-8984-e313b20775f7/raw?se=2026-09-29T13%3A27%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=bf388065-528c-49d6-9dc1-fa13d62cc607&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T03%3A58%3A03Z&ske=2026-09-30T03%3A58%3A03Z&sks=b&skv=2026-02-06&sig=a5XRDgavsMgWUR95NrafQZSeiHpjCvaD2n4LjLkG9Qg%3D' -o assets/content-gia-vi-km/series2-06.png
          curl -L --fail --retry 3 'https://oaisdmntprwestus2.blob.core.windows.net/files/00000000-8814-81f8-ab45-b1469725054f/raw?se=2026-09-29T13%3A27%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=bf388065-528c-49d6-9dc1-fa13d62cc607&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T08%3A53%3A00Z&ske=2026-09-30T08%3A53%3A00Z&sks=b&skv=2026-02-06&sig=1n1lQ5QNSlE29s13mgOsuZZs7S0FBVvY%2B1/cyPE1LeE%3D' -o assets/content-gia-vi-km/series2-07.png

      - name: Validate images
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/content-gia-vi-km/series2-*.png; do
            test "$(stat -c%s "$f")" -gt 100000 || { echo "Image too small: $f"; exit 1; }
            file "$f" | grep -qiE 'PNG image|JPEG image' || { echo "Not an image: $f"; exit 1; }
          done
      - name: Commit images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/content-gia-vi-km/series2-*.png
          if git diff --cached --quiet; then
            echo 'No image changes to commit'
            exit 0
          fi
          git commit -m 'Add new Content Gia vi KM series images'
          git push
