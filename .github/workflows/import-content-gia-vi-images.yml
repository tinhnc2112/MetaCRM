name: Import content gia vi images

on:
  push:
    paths:
      - '.github/workflows/import-content-gia-vi-images.yml'
      - 'assets/content-gia-vi-km/trigger.txt'

permissions:
  contents: write

jobs:
  import-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download generated images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/content-gia-vi-km
          curl -L --fail --retry 3 'https://oaisdmntprwestus.blob.core.windows.net/files/00000000-548c-8230-a692-5d852845b988/raw?se=2026-09-29T07%3A58%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=584e1eaa-c745-419f-8d9f-a326821b677a&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T04%3A02%3A46Z&ske=2026-09-30T04%3A02%3A46Z&sks=b&skv=2026-02-06&sig=wNcllSseDbPhzuIrPydE6vWqWCiBRdM5D9HGB0Y8U9w%3D' -o assets/content-gia-vi-km/caption-01.png
          curl -L --fail --retry 3 'https://oaisdmntprwestus.blob.core.windows.net/files/00000000-0dfc-8230-9ee4-dce4830e2051/raw?se=2026-09-29T07%3A58%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=584e1eaa-c745-419f-8d9f-a326821b677a&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T03%3A45%3A55Z&ske=2026-09-30T03%3A45%3A55Z&sks=b&skv=2026-02-06&sig=fykxqHZegy3gz09v4zvTgLBsTJdCeZNsKRXYHDlLfQ4%3D' -o assets/content-gia-vi-km/caption-02.png
          curl -L --fail --retry 3 'https://oaisdmntprnznorth.blob.core.windows.net/files/00000000-8458-820b-99c7-9dd4f5fc7491/raw?se=2026-09-29T07%3A58%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=584e1eaa-c745-419f-8d9f-a326821b677a&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T06%3A34%3A47Z&ske=2026-09-30T06%3A34%3A47Z&sks=b&skv=2026-02-06&sig=dU3Vq2HY8UP8ePRlzTphGXxHC%2BY/w2/HG0EI/BOIPNc%3D' -o assets/content-gia-vi-km/caption-03.png
          curl -L --fail --retry 3 'https://oaisdmntprnznorth.blob.core.windows.net/files/00000000-e700-820b-ab95-1fbd8003fa28/raw?se=2026-09-29T07%3A58%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=584e1eaa-c745-419f-8d9f-a326821b677a&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T05%3A18%3A29Z&ske=2026-09-30T05%3A18%3A29Z&sks=b&skv=2026-02-06&sig=9fN5rOe8m9D%2BnBKpPktq7mIN1LNiqJ5f6taCDDVycz8%3D' -o assets/content-gia-vi-km/caption-04.png
          curl -L --fail --retry 3 'https://oaisdmntprnznorth.blob.core.windows.net/files/00000000-7724-820b-bb4d-468b6c69e449/raw?se=2026-09-29T07%3A58%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=584e1eaa-c745-419f-8d9f-a326821b677a&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T04%3A00%3A34Z&ske=2026-09-30T04%3A00%3A34Z&sks=b&skv=2026-02-06&sig=z4DBLwPrIEx9VmrOszr6qqT6MiqaFz22Sz31MZ0LCFY%3D' -o assets/content-gia-vi-km/caption-05.png
          curl -L --fail --retry 3 'https://oaisdmntpraustraliaeast.blob.core.windows.net/files/00000000-8cac-81fa-88f0-659b19920934/raw?se=2026-09-29T07%3A58%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=584e1eaa-c745-419f-8d9f-a326821b677a&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T03%3A43%3A42Z&ske=2026-09-30T03%3A43%3A42Z&sks=b&skv=2026-02-06&sig=Pzxaw/4GiKFRU5SsG5KUxptk7j9yhHqiT8rTb3jj0xA%3D' -o assets/content-gia-vi-km/caption-06.png
          curl -L --fail --retry 3 'https://oaisdmntprwestus.blob.core.windows.net/files/00000000-bc9c-8230-85dc-3822956f4723/raw?se=2026-09-29T07%3A58%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=584e1eaa-c745-419f-8d9f-a326821b677a&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T03%3A59%3A58Z&ske=2026-09-30T03%3A59%3A58Z&sks=b&skv=2026-02-06&sig=/GbiCJskVnOrUGUWYpX8u/0ldB9CTZxg9qYptdFOgQo%3D' -o assets/content-gia-vi-km/caption-07.png

      - name: Commit images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/content-gia-vi-km/caption-*.png
          if git diff --cached --quiet; then
            echo 'No image changes to commit'
            exit 0
          fi
          git commit -m 'Add content gia vi KM images'
          git push
